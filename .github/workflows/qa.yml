name: Public release QA
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-qa:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q launch_powerbi.py tools tests
      - run: python -m unittest discover -s tests -v
      - run: python tools/release_qa.py --index
      - run: python tools/reproduce.py
      - run: python launch_powerbi.py --prepare-only
